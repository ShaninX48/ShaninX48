<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#060811"/>
<stop offset="55%" stop-color="#0A0E18"/>
<stop offset="100%" stop-color="#0F1424"/>
</linearGradient>
<radialGradient id="glowC" cx="0.5" cy="0.35" r="0.65">
<stop offset="0%" stop-color="#00E8FF" stop-opacity="0.14"/>
<stop offset="100%" stop-color="#00E8FF" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M44 0H0V44" fill="none" stroke="#00E8FF" stroke-opacity="0.07" stroke-width="1"/>
</pattern>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="50%" stop-color="#fff" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="textClip"><text x="600" y="165" text-anchor="middle" font-family="'Space Grotesk',Inter,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-0.5">MD Tanveer Mahmood Shanin</text></clipPath>
</defs>
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#grid)"/>
<rect width="1200" height="320" fill="url(#glowC)">
<animate attributeName="opacity" values="1;0.6;1" dur="5s" repeatCount="indefinite"/>
</rect>
<!-- rising particles (auto, no mouse needed) -->
<g fill="#00E8FF">
<circle cx="150" cy="300" r="2.5" opacity="0.5"><animate attributeName="cy" values="300;60" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="420" cy="300" r="2" opacity="0.4"><animate attributeName="cy" values="300;80" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="300" r="2.5" opacity="0.45"><animate attributeName="cy" values="300;70" dur="8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0" dur="8s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle cx="1050" cy="300" r="2" opacity="0.4"><animate attributeName="cy" values="300;90" dur="10s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="10s" begin="2.2s" repeatCount="indefinite"/></circle>
</g>
<!-- sea waves (moving like ocean, auto-loop) -->
<g>
<path d="M-400 252 q 100 -20 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 V320 H-400 Z" fill="#00E8FF" opacity="0.16"><animateTransform attributeName="transform" type="translate" values="0 0;400 0" dur="7s" repeatCount="indefinite"/></path>
<path d="M-400 266 q 100 -14 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 V320 H-400 Z" fill="#060811" opacity="0.72"><animateTransform attributeName="transform" type="translate" values="400 0;0 0" dur="10s" repeatCount="indefinite"/></path>
</g>
<text x="600" y="165" text-anchor="middle" font-family="'Space Grotesk',Inter,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-0.5" fill="#F3F6FF">MD Tanveer Mahmood Shanin</text>
<!-- shine sweep across title -->
<g clip-path="url(#textClip)"><rect x="-300" y="90" width="220" height="110" fill="url(#shine)" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="-100 0;1400 0" dur="4.5s" repeatCount="indefinite"/></rect></g>
<text x="600" y="205" text-anchor="middle" font-family="Inter,'JetBrains Mono',Arial,sans-serif" font-size="21" font-weight="500" fill="#E8ECF7">Full-Stack Developer • React • Solidity</text>
<!-- blinking terminal cursor -->
<rect x="872" y="188" width="11" height="22" fill="#00E8FF"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
